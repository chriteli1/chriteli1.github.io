<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse projects by Chriteli.">
    <title>Projects | Chriteli</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10131d;
        color: #f4f2ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 15% 0%, #272d45 0, transparent 42rem),
          #10131d;
      }

      main {
        width: min(100% - 2rem, 960px);
        margin: 0 auto;
        padding: clamp(4rem, 12vh, 8rem) 0 4rem;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #a9b5d5;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .intro {
        max-width: 38rem;
        margin: 1.25rem 0 3rem;
        color: #bbc1d0;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      .project-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 1rem;
      }

      .project-card {
        display: flex;
        min-height: 230px;
        flex-direction: column;
        align-items: flex-start;
        padding: 1.5rem;
        border: 1px solid #343a4d;
        border-radius: 1rem;
        background: linear-gradient(145deg, #202638, #181c29);
        text-decoration: none;
        transition: border-color 160ms ease, transform 160ms ease;
      }

      .project-card:hover {
        transform: translateY(-3px);
        border-color: #9daedb;
      }

      .project-card:focus-visible {
        outline: 3px solid #c5d2f3;
        outline-offset: 4px;
      }

      .project-type {
        margin: 0 0 1.5rem;
        color: #a9b5d5;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .project-card h2 {
        margin: 0;
        color: #f4f2ee;
        font-size: 1.5rem;
      }

      .project-card p:not(.project-type) {
        margin: 0.65rem 0 1.5rem;
        color: #bbc1d0;
        line-height: 1.6;
      }

      .project-link {
        margin-top: auto;
        color: #d3ddfa;
        font-weight: 700;
      }

      footer {
        margin-top: 3rem;
        color: #858da1;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Chriteli's projects</p>
        <h1>Explore</h1>
        <p class="intro">Small experiments, games, and other things I've made. Pick a project to get started.</p>
      </header>

      <section class="project-list" aria-label="Projects">
        <a class="project-card" href="./the_cursed_castle/">
          <p class="project-type">Game</p>
          <h2>The Cursed Castle</h2>
          <p>A medieval platformer with a retro style.</p>
          <span class="project-link">Play the game <span aria-hidden="true">→</span></span>
        </a>
      </section>

      <footer>More projects will appear here as they are added.</footer>
    </main>
  </body>
</html>
